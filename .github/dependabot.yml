version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns: ['boto3', 'botocore', 's3transfer', 'jmespath']
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

name: Release
on:
  workflow_dispatch:
    inputs:
      rollback_version:
        description: 'Optional numeric Lambda version to restore'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['mimamori/**', 'requirements.txt', 'scripts/package.py', 'scripts/release.py', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: aws-learning-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws-learning
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lambda-${{ github.sha }}
          path: build/release
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy tested artifact or roll back
        env:
          FUNCTION_NAME: ${{ vars.AWS_FUNCTION_NAME }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          if [ -n "$ROLLBACK_VERSION" ]; then
            python scripts/release.py --function "$FUNCTION_NAME" --rollback "$ROLLBACK_VERSION"
          else
            python scripts/release.py --function "$FUNCTION_NAME" --zip build/release/lambda.zip
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_id }}
          path: build/release.json
          retention-days: 30
